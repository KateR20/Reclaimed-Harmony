<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Reclaimed Harmony</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f1e8;
      color: #2b2725;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .thank-you-card {
      background: #ffffff;
      max-width: 650px;
      width: 100%;
      text-align: center;
      padding: 60px 40px;
      border-radius: 4px;
    }

    .thank-you-card img {
      width: 110px;
      margin-bottom: 25px;
    }

    .eyebrow {
      color: #b87425;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-weight: bold;
      font-size: 14px;
    }

    h1 {
      color: #9f174d;
      font-size: 42px;
      margin: 15px 0;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .home-button {
      display: inline-block;
      background: #8c123d;
      color: #ffffff;
      text-decoration: none;
      padding: 16px 28px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .home-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="thank-you-card">

    <img src="images/RHlogo.png" alt="Reclaimed Harmony">

    <div class="eyebrow">Reclaimed Harmony</div>

    <h1>Thank You!</h1>

    <p>
      Your inquiry has been sent successfully.
      Michelle will be in touch soon to chat about your space
      and how Reclaimed Harmony can help.
    </p>

    <a href="index.html" class="home-button">Return Home</a>

  </div>

</body>
</html>
